<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>CodeHub Interactive Lesson Studio</title>
<meta name="description" content="محاضرة تفاعلية بالعامية المصرية — شرح + لعبة تعليمية بدون scroll — CodeHub">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Readex+Pro:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F0EA;
  --bg-2:#EAE7DF;
  --surface:#F9F8F4;
  --surface-hi:#EDEAE2;
  --code-bg:#F0EEE8;
  --code-gutter:#E6E3DA;
  --preview-bg:#FDFCF9;
  --border:#DBD7CC;
  --border-hi:#C4BEB0;
  --text:#182230;
  --text-body:#2B3748;
  --text-soft:#4E5D73;
  --muted:#69768C;
  --accent:#0E7C90;
  --accent-hi:#0A6576;
  --accent-soft:rgba(14,124,144,.09);
  --accent-bd:rgba(14,124,144,.32);
  --amber:#B3700B;
  --amber-soft:rgba(179,112,11,.10);
  --amber-bd:rgba(179,112,11,.34);
  --ok:#167E5C;
  --ok-soft:rgba(22,126,92,.10);
  --ok-bd:rgba(22,126,92,.34);
  --bad:#C03943;
  --bad-soft:rgba(192,57,67,.09);
  --bad-bd:rgba(192,57,67,.35);
  --on-accent:#F9F8F4;
  --shadow-sm:0 1px 2px rgba(24,34,48,.05);
  --shadow-md:0 12px 32px rgba(24,34,48,.12);
  --r:12px;
  --r-sm:8px;
  --font:'IBM Plex Sans Arabic',system-ui,-apple-system,sans-serif;
  --display:'Readex Pro','IBM Plex Sans Arabic',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  --ease:cubic-bezier(.22,1,.36,1);
  --rail-w:308px;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,textarea{font-family:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
bdi,code{unicode-bidi:isolate}
code{
  font-family:var(--mono);font-size:.84em;font-weight:500;
  background:rgba(14,124,144,.08);border:1px solid rgba(14,124,144,.2);
  padding:.07em .42em;border-radius:5px;color:#0B5C6B;direction:ltr;display:inline-block;
}
.ltr{direction:ltr;text-align:left;unicode-bidi:isolate}
.ic{width:15px;height:15px;display:inline-block;vertical-align:-.18em;flex-shrink:0}
.ic-sm{width:13.5px;height:13.5px}

/* ─── Contained Scrollbars (Warm Stone) ─────────────────────────────────── */
.scroll{overflow:auto;overscroll-behavior:contain;scrollbar-gutter:stable;scrollbar-width:thin;scrollbar-color:#CBC6B8 transparent}
.scroll::-webkit-scrollbar{width:6px;height:6px}
.scroll::-webkit-scrollbar-thumb{background:#CBC6B8;border-radius:99px}
.scroll::-webkit-scrollbar-thumb:hover{background:#B2AC9C}
.scroll-x{overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;scrollbar-width:none}
.scroll-x::-webkit-scrollbar{display:none}

/* ─── Root Full-Viewport App Shell (L1, L2) ─────────────────────────────── */
.app{
  display:grid;height:100vh;height:100dvh;min-height:0;overflow:hidden;
  grid-template-rows:50px minmax(0,1fr);background:var(--bg);
}
.topbar,.studio,.rail,.workspace,.ws-body,.doc-split,.doc-prose-wrap,.lab-col,.game-shell,.playfield{min-width:0;min-height:0}

/* ─── 1. Global Header (Quiet Pearl Bar) ────────────────────────────────── */
.topbar{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:0 14px;background:var(--bg-2);border-bottom:1px solid var(--border);
  position:relative;z-index:20;
}
.top-start{display:flex;align-items:center;gap:10px;min-width:0}
.icon-btn{
  width:32px;height:32px;border-radius:var(--r-sm);display:grid;place-items:center;flex-shrink:0;
  border:1px solid var(--border);background:var(--surface);color:var(--text-soft);
  transition:background .15s var(--ease),border-color .15s,color .15s;
}
.icon-btn:hover{background:var(--surface-hi);border-color:var(--border-hi);color:var(--text)}
.icon-btn[aria-expanded="true"]{color:var(--accent);border-color:var(--accent-bd);background:var(--surface)}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.brand-mark{
  width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex-shrink:0;
  background:var(--surface);border:1px solid var(--border);color:var(--accent);
}
.brand-mark svg{width:16px;height:16px}
.brand-txt{min-width:0}
.brand-title{font-family:var(--display);font-size:14.5px;font-weight:600;line-height:1.2;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-sub{font-size:11.5px;color:var(--muted);line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.top-end{display:flex;align-items:center;gap:8px;flex-shrink:0}
.prog-meter{
  display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;border-radius:var(--r-sm);
  background:var(--surface);border:1px solid var(--border);font-size:12px;color:var(--text-soft);
}
.prog-lbl{color:var(--muted);font-weight:500}
.prog-bar{width:64px;height:5px;border-radius:99px;background:var(--bg-2);overflow:hidden}
.prog-fill{height:100%;border-radius:99px;background:var(--amber);transition:width .35s var(--ease)}
.prog-fill.full{background:var(--ok)}
.prog-val{font-family:var(--mono);font-size:11.5px;font-weight:600;color:var(--text);direction:ltr}

.xp-chip{
  display:inline-flex;align-items:center;gap:5px;height:32px;padding:0 10px;border-radius:var(--r-sm);
  background:var(--surface);border:1px solid var(--border);
  font-family:var(--mono);font-size:12px;font-weight:600;color:var(--amber);direction:ltr;
}
.xp-chip.bump{border-color:var(--amber-bd);background:var(--amber-soft);transition:all .2s}
.combo-chip{
  display:inline-flex;align-items:center;gap:4px;height:32px;padding:0 9px;border-radius:99px;
  background:var(--amber-soft);border:1px solid var(--amber-bd);
  font-family:var(--mono);font-size:11.5px;font-weight:600;color:var(--amber);
}
.top-div{width:1px;height:18px;background:var(--border);margin:0 2px}
.util-btn{
  display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 11px;border-radius:var(--r-sm);
  border:1px solid var(--border);background:var(--surface);color:var(--text-soft);
  font-size:12.5px;font-weight:500;transition:background .15s var(--ease),border-color .15s,color .15s;
}
.util-btn:hover{background:var(--surface-hi);border-color:var(--border-hi);color:var(--text)}
.util-btn.active{background:var(--accent-soft);border-color:var(--accent-bd);color:var(--accent)}

/* ─── 2. Two-Pane Workspace + Collapsible Chapter Sidebar ───────────────── */
.studio{
  display:grid;height:100%;overflow:hidden;position:relative;
  grid-template-columns:var(--rail-w) minmax(0,1fr);
  transition:grid-template-columns .2s var(--ease);
}
.studio.rail-collapsed{grid-template-columns:0px minmax(0,1fr)}

.rail{
  display:flex;flex-direction:column;overflow:hidden;
  background:var(--bg-2);border-inline-end:1px solid var(--border);
  transition:opacity .18s var(--ease),transform .2s var(--ease);
}
.studio.rail-collapsed .rail{opacity:0;pointer-events:none;border-inline-end-color:transparent}
.rail-head{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  height:44px;padding:0 14px;border-bottom:1px solid var(--border);flex-shrink:0;
}
.rail-head-title{display:flex;align-items:center;gap:7px;font-family:var(--display);font-size:13px;font-weight:600;color:var(--text)}
.rail-count{
  font-family:var(--mono);font-size:11px;font-weight:500;color:var(--muted);
  padding:1px 7px;border-radius:99px;background:var(--surface);border:1px solid var(--border);
}
.rail-list{flex:1;display:flex;flex-direction:column;gap:2px;padding:8px}

/* Chapter Row: Clean 3-State Hierarchy (Completed / Active / Upcoming) */
.sec-tab{
  position:relative;display:flex;align-items:center;gap:10px;width:100%;text-align:right;
  padding:8px 10px;border-radius:var(--r-sm);border:1px solid transparent;background:transparent;
  transition:background .14s var(--ease),border-color .14s,color .14s;flex-shrink:0;
}
.sec-tab::before{
  content:'';position:absolute;inset-block:7px;inset-inline-start:0;width:2.5px;border-radius:99px;
  background:var(--accent);opacity:0;transition:opacity .16s var(--ease);
}
.sec-tab:hover{background:rgba(249,248,244,.6)}
.sec-tab.active{background:var(--surface);border-color:var(--border);box-shadow:var(--shadow-sm)}
.sec-tab.active::before{opacity:1}
.sec-tab.boss.active::before{background:var(--amber)}

.sec-num{
  width:24px;height:24px;border-radius:6px;display:grid;place-items:center;flex-shrink:0;
  font-family:var(--mono);font-size:11px;font-weight:600;
  background:var(--bg);color:var(--muted);border:1px solid var(--border);
}
.sec-tab.active .sec-num{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-bd)}
.sec-tab.done .sec-num{background:var(--ok-soft);color:var(--ok);border-color:var(--ok-bd)}
.sec-tab.boss .sec-num{background:var(--amber-soft);color:var(--amber);border-color:var(--amber-bd)}

.sec-info{min-width:0;flex:1}
.sec-title{
  display:block;font-size:13px;font-weight:500;color:var(--text-soft);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.35;
}
.sec-tab:hover .sec-title{color:var(--text)}
.sec-tab.active .sec-title{color:var(--text);font-weight:600}
.sec-stat{
  font-family:var(--mono);font-size:11px;font-weight:500;color:var(--muted);
  flex-shrink:0;direction:ltr;
}
.sec-tab.done .sec-stat{color:var(--ok)}
.sec-tab.active .sec-stat{color:var(--text-soft)}

.rail-foot{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:9px 14px;border-top:1px solid var(--border);flex-shrink:0;
}
.rail-foot-note{font-size:11.5px;color:var(--muted)}
.rail-link{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--accent);text-decoration:none}
.rail-link:hover{text-decoration:underline;color:var(--accent-hi)}

.drawer-backdrop{
  display:none;position:fixed;inset:0;z-index:140;background:rgba(24,34,48,.34);
  opacity:0;transition:opacity .18s var(--ease);
}
.drawer-backdrop.open{display:block;opacity:1}

/* ─── 3. Main Workspace & Consolidated Lesson Header ────────────────────── */
.workspace{display:flex;flex-direction:column;overflow:hidden;background:var(--surface)}

.ws-head{
  background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;
}
.ws-head-top{
  display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
  padding:11px 22px 8px;
}
.ws-heading{display:flex;align-items:baseline;gap:10px;min-width:0;flex-wrap:wrap}
.ws-sec-id{
  font-family:var(--mono);font-size:12px;font-weight:600;color:var(--accent);flex-shrink:0;
}
.ws-sec-id.boss{color:var(--amber)}
.ws-heading h1{
  font-family:var(--display);margin:0;font-size:clamp(16px,1.45vw,19px);font-weight:600;
  color:var(--text);line-height:1.3;letter-spacing:-.01em;
}
.ws-en{font-size:12px;color:var(--muted);font-weight:400;direction:ltr}

/* Restrained Segmented Switcher (Explain <-> Practice) */
.mode-switch{
  display:inline-grid;grid-template-columns:1fr 1fr;gap:3px;padding:3px;
  border-radius:9px;background:var(--bg-2);border:1px solid var(--border);flex-shrink:0;
}
.mode-btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  height:30px;padding:0 12px;border-radius:6px;font-size:12.5px;font-weight:500;
  color:var(--text-soft);border:1px solid transparent;transition:all .16s var(--ease);white-space:nowrap;
}
.mode-btn:hover{color:var(--text)}
.mode-btn.active{
  background:var(--surface);color:var(--text);font-weight:600;border-color:var(--border);box-shadow:var(--shadow-sm);
}
.mode-btn.active svg{color:var(--accent)}

/* Underline Sub-Tabs Bar */
.ws-tabs-row{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:0 22px;border-top:1px solid rgba(219,215,204,.65);background:var(--bg);
}
.ws-tabs{display:flex;align-items:stretch;gap:4px;flex:1;min-width:0}
.ws-tab{
  position:relative;display:inline-flex;align-items:center;gap:6px;
  height:36px;padding:0 12px;font-size:13px;font-weight:500;color:var(--text-soft);
  border-bottom:2px solid transparent;white-space:nowrap;flex-shrink:0;
  transition:color .16s var(--ease),border-color .16s var(--ease),background .16s;
}
.ws-tab:hover{color:var(--text);background:rgba(24,34,48,.03)}
.ws-tab.active{color:var(--text);font-weight:600;border-bottom-color:var(--accent)}
.ws-tab.solved{color:var(--ok)}
.ws-tab.solved.active{color:var(--text);border-bottom-color:var(--ok)}
.ws-meta{font-size:12px;color:var(--muted);flex-shrink:0;white-space:nowrap}
.hearts-bar{display:inline-flex;align-items:center;gap:4px;color:var(--bad);font-family:var(--mono);font-size:12px;font-weight:600;flex-shrink:0}
.hearts-bar svg{width:14px;height:14px}
.hearts-bar svg.lost{color:var(--border-hi);opacity:.55}

.ws-body{flex:1;overflow:hidden;display:flex;flex-direction:column}

/* ─── 4. EXPLAIN MODE: Editorial Ivory Reading + Unified Light Coding Lab ── */
.doc-split{
  flex:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.06fr);
  overflow:hidden;animation:fadeIn .18s var(--ease);
}
.doc-split.single{grid-template-columns:1fr}

/* Right Column: Unboxed Warm Ivory Reading Surface */
.doc-prose-wrap{
  overflow:auto;padding:24px 28px;border-inline-end:1px solid var(--border);
  background:var(--surface);
}
.doc-split.single .doc-prose-wrap{border-inline-end:0;display:flex;justify-content:center}
.doc-prose{
  width:100%;max-width:62ch;display:flex;flex-direction:column;gap:16px;
}
.doc-h2{
  font-family:var(--display);margin:0;font-size:17px;font-weight:600;color:var(--text);
  line-height:1.4;padding-bottom:10px;border-bottom:1px solid var(--border);
}
.doc-p{margin:0;font-size:15px;font-weight:400;line-height:1.88;color:var(--text-body)}
.doc-p strong{color:var(--text);font-weight:600}

/* Restrained Contextual Insight Blocks (Analogy / Tip / Warning) */
.insight{
  display:flex;align-items:flex-start;gap:10px;padding:12px 15px;border-radius:var(--r-sm);
  background:var(--bg);border:1px solid var(--border);border-inline-start:3px solid var(--amber);
  font-size:14px;line-height:1.8;color:var(--text-body);
}
.insight.tip{border-inline-start-color:var(--ok);background:#EFF5F1}
.insight.warn{border-inline-start-color:var(--bad);background:#F8F0F0}
.insight.analogy{background:#F6F2E8}
.insight-ico{margin-top:3px;flex-shrink:0;color:var(--amber)}
.insight.tip .insight-ico{color:var(--ok)}
.insight.warn .insight-ico{color:var(--bad)}
.insight strong{color:var(--text);font-weight:600}

/* Reference Cards & Tables (Crisp 1px Warm Layers) */
.ref-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(210px,100%),1fr));gap:10px}
.ref-card{
  padding:12px 14px;border-radius:var(--r-sm);background:var(--bg);border:1px solid var(--border);
  display:flex;flex-direction:column;gap:5px;
}
.ref-card-h{font-size:13px;font-weight:600;color:var(--text);display:flex;align-items:center;justify-content:space-between;gap:6px}
.ref-card-h .code-lbl{font-family:var(--mono);font-size:12.5px;color:#0B5C6B;direction:ltr}
.ref-card-d{font-size:13.5px;color:var(--text-soft);line-height:1.68}

.doc-table-wrap{overflow:auto;border-radius:var(--r-sm);border:1px solid var(--border);background:var(--surface)}
.doc-table{width:100%;border-collapse:collapse;font-size:13.5px}
.doc-table th,.doc-table td{padding:9px 12px;border-bottom:1px solid var(--border);text-align:right;line-height:1.58}
.doc-table th{background:var(--bg-2);color:var(--text);font-size:12px;font-weight:600}
.doc-table tr:last-child td{border-bottom:0}

/* Left Column: Unified Interactive Coding Lab (Light Editorial IDE) */
.lab-col{
  overflow:auto;padding:18px 20px;background:var(--bg);
  display:flex;flex-direction:column;gap:14px;
}
.coding-lab{
  display:flex;flex-direction:column;border-radius:var(--r);overflow:hidden;
  background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow-sm);flex-shrink:0;
}
.lab-bar{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  height:36px;padding:0 12px;background:var(--bg-2);border-bottom:1px solid var(--border);
  direction:ltr;
}
.lab-tab{
  display:inline-flex;align-items:center;gap:7px;height:100%;padding:0 6px;
  font-family:var(--mono);font-size:12px;font-weight:600;color:var(--text);
  border-top:2px solid var(--accent);background:var(--code-bg);
}
.lab-tab svg{color:var(--accent);width:13px;height:13px}
.lab-bar-meta{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted)}
.lang-pill{
  font-family:var(--mono);font-size:10.5px;font-weight:600;padding:2px 6px;border-radius:4px;
  background:var(--surface);border:1px solid var(--border);color:var(--text-soft);text-transform:uppercase;
}

/* Line-Numbered Light Code Surface (Soft Pearl-Stone, High-Contrast Syntax) */
.code-box{
  background:var(--code-bg);overflow:auto;padding:10px 0;direction:ltr;text-align:left;unicode-bidi:isolate;
}
.code-lines-inner{display:inline-block;min-width:100%}
.code-line{
  display:flex;align-items:baseline;min-height:24px;padding:0 14px 0 0;
  font-family:var(--mono);font-size:13px;line-height:1.72;color:#1F2937;
}
.code-line:hover{background:rgba(24,34,48,.03)}
.ln{
  width:36px;padding-right:12px;text-align:right;color:#828D9E;font-size:11.5px;
  user-select:none;flex-shrink:0;border-right:1px solid var(--border);margin-right:12px;
}
.lc{white-space:pre;flex:1;min-width:0;direction:ltr;unicode-bidi:isolate}
.syn-tag{color:#0F6E54}.syn-attr{color:#1D5FA7}.syn-val{color:#A85418}
.syn-com{color:#768396;font-style:italic}.syn-kw{color:#9B2C52}.syn-fn{color:#0E7C90}
.syn-ar{unicode-bidi:isolate;direction:rtl;font-family:var(--font);font-size:.96em;color:#182230}

/* Subtle Interactive Code Token Highlighting */
.spot{
  display:inline;font-family:inherit;font-size:inherit;line-height:inherit;
  padding:1px 4px;margin:0 1px;border-radius:4px;
  background:rgba(14,124,144,.10);border-bottom:1.5px solid rgba(14,124,144,.55);
  color:#111B27;transition:background .15s var(--ease),border-color .15s,color .15s;
}
.spot:hover{background:rgba(14,124,144,.18)}
.spot.seen{background:rgba(22,126,92,.10);border-bottom-color:var(--ok);color:#0E4E39}
.spot.active{background:rgba(179,112,11,.16);border-bottom:2px solid var(--amber);color:#182230}

/* Docked Code Inspector Strip */
.lab-inspector{
  display:flex;align-items:flex-start;gap:9px;padding:10px 14px;
  background:var(--surface);border-top:1px solid var(--border);
  font-size:13.5px;line-height:1.7;color:var(--text-body);
}
.lab-inspector svg{color:var(--accent);margin-top:3px;flex-shrink:0}
.lab-inspector.has-active{background:#F7F3EA}
.lab-inspector.has-active svg{color:var(--amber)}
.lab-inspector .insp-tok{
  font-family:var(--mono);font-size:12.5px;font-weight:600;color:var(--amber);
  direction:ltr;display:inline-block;unicode-bidi:isolate;margin-inline-end:6px;
}

/* Integrated Live Browser Preview & Light Console Output */
.lab-preview{border-top:1px solid var(--border);display:flex;flex-direction:column}
.preview-chrome{
  display:flex;align-items:center;gap:10px;height:36px;padding:0 12px;
  background:var(--bg-2);border-bottom:1px solid var(--border);direction:ltr;
}
.preview-nav{display:flex;gap:6px;color:var(--muted);font-size:13px;user-select:none;flex-shrink:0}
.preview-url{
  flex:1;min-width:0;display:flex;align-items:center;gap:6px;height:24px;padding:0 9px;
  border-radius:6px;background:var(--surface);border:1px solid var(--border);
  font-family:var(--mono);font-size:11.5px;color:var(--text-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.preview-url svg{width:11px;height:11px;color:var(--muted);flex-shrink:0}
.live-badge{
  display:inline-flex;align-items:center;gap:5px;font-family:var(--font);font-size:11.5px;font-weight:600;
  color:var(--ok);flex-shrink:0;direction:rtl;
}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--ok)}
.browser-body{
  padding:16px 18px;background:var(--preview-bg);color:#182230;font-family:var(--font);
  font-size:14px;line-height:1.62;min-height:68px;
}
.browser-body h1{font-size:1.5em;margin:.12em 0;color:#182230}
.browser-body h2{font-size:1.22em;margin:.12em 0;color:#182230}
.browser-body h3{font-size:1.05em;margin:.12em 0;color:#182230}
.browser-body p{margin:.32em 0}
.browser-body a{color:#0E7C90;text-decoration:underline}
.browser-body table{border-collapse:collapse;width:100%;font-size:.88em}
.browser-body th,.browser-body td{border:1px solid #D4D0C5;padding:5px 8px}
.browser-body th{background:#F2F0EA}
.browser-body blockquote{border-right:3px solid #9AA5B4;padding:4px 10px;margin:4px 0;color:#475569;font-style:italic;background:#F4F2EC}

.console-pane{border-top:1px solid var(--border);background:#ECEFF2}
.console-head{
  display:flex;align-items:center;justify-content:space-between;height:30px;padding:0 12px;
  background:#E4E7EC;border-bottom:1px solid var(--border);
  font-family:var(--mono);font-size:11.5px;font-weight:600;color:var(--ok);direction:ltr;
}
.console-body{padding:10px 14px;font-family:var(--mono);font-size:12.5px;line-height:1.7;color:#1E293B;direction:ltr;text-align:left}
.console-line{display:flex;gap:8px}.console-line::before{content:'›';color:var(--ok);font-weight:700}

/* ─── 5. PLAY MODE: Cohesive Light Challenge Workspace ──────────────────── */
.game-shell{
  flex:1;overflow:auto;padding:20px 24px;display:flex;flex-direction:column;align-items:center;
  background:var(--bg);
}
.game-inner{
  width:100%;max-width:980px;display:flex;flex-direction:column;gap:14px;animation:fadeIn .18s var(--ease);
}
.mission-head{
  display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
  padding:14px 18px;border-radius:var(--r);background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow-sm);
}
.mission-head h2{font-family:var(--display);margin:0;font-size:clamp(15px,1.35vw,17.5px);font-weight:600;line-height:1.5;outline:none;flex:1;min-width:220px;color:var(--text)}
.type-pill{
  display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;
  font-size:12px;font-weight:600;background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent-bd);flex-shrink:0;
}
.playfield{
  display:flex;flex-direction:column;gap:14px;padding:18px;
  border-radius:var(--r);background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow-sm);
}

/* Mechanics: Crisp Warm Editorial Surfaces */
.opt-grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr))}
.opt-btn{
  display:flex;flex-direction:column;align-items:stretch;gap:10px;text-align:right;
  padding:13px 15px;border-radius:10px;border:1px solid var(--border);background:var(--bg);
  min-height:50px;font-size:14.5px;font-weight:500;color:var(--text);
  transition:background .15s var(--ease),border-color .15s,transform .12s;
}
.opt-btn:hover:not(:disabled){background:var(--surface-hi);border-color:var(--border-hi)}
.opt-btn:active:not(:disabled){transform:scale(.99)}
.opt-btn:disabled{opacity:.65;cursor:default}
.opt-btn.ok{border-color:var(--ok);background:var(--ok-soft);color:#0E4E39;opacity:1}
.opt-btn.bad{border-color:var(--bad);background:var(--bad-soft);color:#7E1D24;animation:shake .22s}
.opt-row{display:flex;align-items:center;gap:10px}
.opt-k{
  width:26px;height:26px;border-radius:6px;display:grid;place-items:center;flex-shrink:0;
  background:var(--surface);border:1px solid var(--border);font-family:var(--mono);font-size:12px;font-weight:600;color:var(--accent);
}
.opt-prev-box{border-radius:8px;overflow:hidden;border:1px solid var(--border);background:var(--preview-bg)}

.tray{
  display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;
  padding:11px;border-radius:10px;background:var(--bg);border:1px dashed var(--border-hi);
}
.chip{
  display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:6px 13px;
  border-radius:8px;border:1px solid var(--border-hi);background:var(--surface);
  font-size:13.5px;font-weight:500;color:var(--text);user-select:none;touch-action:none;
  box-shadow:var(--shadow-sm);transition:background .14s var(--ease),border-color .14s,transform .14s,opacity .14s;
}
.chip.code-chip{font-family:var(--mono);direction:ltr;font-size:13px}
.chip:hover{background:var(--surface-hi);border-color:var(--accent)}
.chip.picked{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-hi)}
.chip.used{opacity:.32;pointer-events:none;box-shadow:none}
.chip.locked{border-color:var(--ok-bd);background:var(--ok-soft);color:#0E4E39;cursor:default;box-shadow:none}
.chip.bad{border-color:var(--bad);background:var(--bad-soft);color:#7E1D24;animation:shake .22s}
.drag-ghost{position:fixed;z-index:999;pointer-events:none;transform:translate(-50%,-50%) scale(1.03);box-shadow:var(--shadow-md);border-color:var(--accent)!important;background:var(--surface)!important}
.drop-over{border-color:var(--accent)!important;background:var(--accent-soft)!important}

.slot-blank{
  display:inline-flex;align-items:center;justify-content:center;min-width:78px;height:26px;
  padding:0 9px;margin:0 3px;border-radius:6px;vertical-align:middle;
  border:1px dashed var(--accent);background:var(--accent-soft);color:var(--accent);
  font-family:var(--mono);font-size:12.5px;font-weight:600;transition:all .14s;
}
.slot-blank.filled{border-style:solid;background:rgba(14,124,144,.14);color:var(--text)}
.slot-blank.ok{border-color:var(--ok);background:var(--ok-soft);color:#0E4E39}
.slot-blank.bad{border-color:var(--bad);background:var(--bad-soft);color:#7E1D24;animation:shake .22s}

.buckets-grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr))}
.bucket{
  display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:10px;
  border:1px dashed var(--border-hi);background:var(--bg);min-height:106px;transition:border-color .15s,background .15s;
}
.bucket-h{font-family:var(--display);font-size:13px;font-weight:600;color:var(--accent);text-align:center;padding-bottom:7px;border-bottom:1px solid var(--border)}
.bucket-items{display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;flex:1}
.bucket.hint-glow{border-color:var(--amber);background:var(--amber-soft)}
.wireframe-page{display:grid;gap:8px;direction:ltr;grid-template-areas:"header header" "nav nav" "main aside" "footer footer";grid-template-columns:2.2fr 1fr}
.wireframe-table{display:grid;gap:8px;direction:ltr;grid-template-columns:1fr}
.wireframe-page .bucket,.wireframe-table .bucket{min-height:64px;padding:8px 10px}

.order-list{display:flex;flex-direction:column;gap:7px;width:100%}
.order-row{
  display:flex;align-items:center;gap:12px;padding:9px 13px;border-radius:10px;
  border:1px solid var(--border);background:var(--bg);min-height:46px;user-select:none;touch-action:none;
  transition:border-color .15s,background .15s;
}
.order-row:hover{border-color:var(--border-hi);background:var(--surface-hi)}
.order-row.ok{border-color:var(--ok);background:var(--ok-soft)}
.order-row.bad{border-color:var(--bad);background:var(--bad-soft);animation:shake .22s}
.order-idx{
  width:26px;height:26px;border-radius:6px;display:grid;place-items:center;flex-shrink:0;
  background:var(--surface);border:1px solid var(--border);font-family:var(--mono);font-size:12px;font-weight:600;color:var(--accent);
}
.order-txt{flex:1;min-width:0;font-size:14px;font-weight:500}
.order-txt.mono{font-family:var(--mono);direction:ltr;text-align:left;font-size:13px}
.mv-btns{display:flex;gap:4px;flex-shrink:0}
.mv-btn{width:32px;height:32px;border-radius:7px;border:1px solid var(--border);background:var(--surface);display:grid;place-items:center;font-size:11px;color:var(--text-soft);transition:all .14s}
.mv-btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.mv-btn:disabled{opacity:.32;cursor:not-allowed}

.bug-tok{
  display:inline;font-family:inherit;font-size:inherit;padding:1px 5px;border-radius:4px;
  background:rgba(24,34,48,.04);border-bottom:1.5px solid rgba(78,93,115,.38);
  color:inherit;transition:background .14s,border-color .14s;
}
.bug-tok:hover{background:var(--amber-soft);border-bottom-color:var(--amber)}
.bug-tok.found{background:var(--ok-soft);border-bottom:2px solid var(--ok);color:#0E4E39}
.bug-tok.safe-hit{background:var(--bad-soft);border-bottom-color:var(--bad);animation:shake .22s}

.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:stretch}
.match-col{display:flex;flex-direction:column;gap:7px}
.m-btn{
  width:100%;min-height:46px;padding:9px 13px;border-radius:10px;
  border:1px solid var(--border);background:var(--bg);font-size:13.5px;font-weight:500;
  text-align:center;color:var(--text);transition:all .15s var(--ease);
}
.m-btn.mono-m{font-family:var(--mono);font-size:13px;direction:ltr}
.m-btn:hover:not(:disabled){background:var(--surface-hi);border-color:var(--border-hi)}
.m-btn.picked{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-hi)}
.m-btn.ok{border-color:var(--ok);background:var(--ok-soft);color:#0E4E39;cursor:default}
.m-btn.bad{border-color:var(--bad);background:var(--bad-soft);animation:shake .22s}
.m-btn.hint-glow{border-color:var(--amber);background:var(--amber-soft)}

/* Unified Split Mini-IDE (Patch Mechanic) */
.patch-lab{
  display:grid;grid-template-columns:minmax(0,1.15fr) minmax(240px,.85fr);
  border-radius:var(--r);overflow:hidden;border:1px solid var(--border);background:var(--surface);
}
.patch-pane{display:flex;flex-direction:column;min-width:0;border-inline-end:1px solid var(--border)}
.patch-tools{
  display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:space-between;
  padding:8px 10px;background:var(--bg-2);border-bottom:1px solid var(--border);
}
.chip-bar{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.ins-chip{
  font-family:var(--mono);font-size:12px;padding:4px 9px;border-radius:6px;direction:ltr;
  border:1px solid var(--accent-bd);background:var(--surface);color:var(--accent);min-height:30px;font-weight:500;
  transition:background .14s,border-color .14s;
}
.ins-chip:hover{background:var(--accent-soft);border-color:var(--accent)}
.patch-ta{
  width:100%;min-height:152px;flex:1;resize:none;padding:12px 14px;border:0;
  background:var(--code-bg);color:#182230;
  font-family:var(--mono);font-size:13px;line-height:1.72;direction:ltr;text-align:left;
}
.patch-ta:focus{outline:none;box-shadow:inset 0 0 0 1.5px var(--accent)}
.patch-out{display:flex;flex-direction:column;min-width:0;min-height:152px;background:var(--preview-bg)}
.patch-out iframe{border:0;width:100%;flex:1;min-height:120px;background:var(--preview-bg)}
.patch-out.js-out{background:var(--code-bg)}
.patch-check-list{padding:12px;display:flex;flex-direction:column;gap:7px;font-size:13px}
.pchk{
  display:flex;align-items:flex-start;gap:8px;padding:8px 10px;border-radius:8px;
  background:var(--surface);border:1px solid var(--border);color:var(--text-soft);transition:all .16s;
}
.pchk.pass{background:var(--ok-soft);border-color:var(--ok-bd);color:#0E4E39}
.pchk svg{margin-top:2px;flex-shrink:0}

/* ─── 6. Lesson Navigation Footer Dock ──────────────────────────────────── */
.ws-dock{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  min-height:52px;padding:8px 22px calc(8px + env(safe-area-inset-bottom));
  border-top:1px solid var(--border);background:var(--bg-2);flex-shrink:0;
}
.dock-g{display:flex;align-items:center;gap:7px;flex-shrink:0}
.btn-primary{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  height:36px;padding:0 16px;border-radius:9px;
  background:var(--accent);color:var(--on-accent);font-family:var(--display);font-size:13px;font-weight:600;
  transition:background .15s var(--ease),transform .12s;white-space:nowrap;
}
.btn-primary:hover:not(:disabled){background:var(--accent-hi)}
.btn-primary:active:not(:disabled){transform:scale(.98)}
.btn-primary:disabled{opacity:.42;cursor:not-allowed}
.btn-sec{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  height:36px;padding:0 12px;border-radius:9px;
  border:1px solid var(--border);background:var(--surface);color:var(--text-soft);
  font-size:13px;font-weight:500;transition:background .15s,border-color .15s,color .15s;white-space:nowrap;
}
.btn-sec:hover:not(:disabled){background:var(--surface-hi);border-color:var(--border-hi);color:var(--text)}
.btn-sec:disabled{opacity:.4;cursor:not-allowed}
.btn-sec.pulse{border-color:var(--amber-bd);color:var(--amber);background:var(--amber-soft)}
.toast{
  flex:1;min-width:0;text-align:center;font-size:13px;font-weight:500;line-height:1.45;
  padding:6px 12px;border-radius:8px;color:var(--text-soft);overflow:hidden;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
}
.toast.ok{color:#0E5940;background:var(--ok-soft);border:1px solid var(--ok-bd)}
.toast.bad{color:#91252D;background:var(--bad-soft);border:1px solid var(--bad-bd)}
.toast.warn{color:#8A5608;background:var(--amber-soft);border:1px solid var(--amber-bd)}
.toast.info{color:var(--text-soft);background:transparent}

/* ─── Recall & Submission Summary Views ─────────────────────────────────── */
.recall-wrap{flex:1;overflow:auto;padding:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--bg);animation:fadeIn .18s var(--ease)}
.flashcard{
  width:min(640px,100%);padding:26px 24px;border-radius:var(--r);
  background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow-sm);
  text-align:center;display:flex;flex-direction:column;gap:14px;
}
.flash-q{font-family:var(--display);font-size:17.5px;font-weight:600;line-height:1.6;color:var(--text)}
.flash-a{
  font-size:14.5px;color:#0E4E39;padding:14px 16px;border-radius:var(--r-sm);
  background:var(--ok-soft);border:1px solid var(--ok-bd);line-height:1.75;
}
.sum-list{list-style:none;margin:0;padding:0;width:min(720px,100%);display:flex;flex-direction:column;gap:8px}
.sum-list li{
  display:flex;align-items:flex-start;gap:11px;padding:12px 15px;border-radius:10px;
  background:var(--surface);border:1px solid var(--border);font-size:14.5px;line-height:1.75;color:var(--text-body);
}
.sum-num{
  width:24px;height:24px;border-radius:6px;display:grid;place-items:center;flex-shrink:0;
  background:var(--bg);border:1px solid var(--border);color:var(--accent);
  font-family:var(--mono);font-size:12px;font-weight:600;margin-top:2px;
}

/* ─── Single Modal Slot ─────────────────────────────────────────────────── */
.overlay{position:fixed;inset:0;z-index:200;display:grid;place-items:center;padding:16px;background:rgba(24,34,48,.42)}
.overlay[hidden]{display:none}
.modal{
  width:min(460px,100%);max-height:90dvh;display:flex;flex-direction:column;gap:14px;
  padding:20px;border-radius:14px;background:var(--surface);border:1px solid var(--border-hi);
  box-shadow:var(--shadow-md);animation:pop .18s var(--ease);
}
.modal h3{font-family:var(--display);margin:0;font-size:17px;font-weight:600;display:flex;align-items:center;justify-content:space-between;gap:10px;color:var(--text)}
.modal-body{overflow:auto;display:flex;flex-direction:column;gap:10px;font-size:14px;line-height:1.7;color:var(--text-body)}
.modal-foot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.clear-ring{
  width:52px;height:52px;border-radius:50%;margin:2px auto;display:grid;place-items:center;
  background:var(--ok-soft);border:1px solid var(--ok-bd);color:var(--ok);
}
.clear-ring svg{width:24px;height:24px}

@keyframes fadeIn{0%{opacity:0;transform:translateY(4px)}100%{opacity:1;transform:translateY(0)}}
@keyframes pop{0%{transform:scale(.96);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* ─── 7. Responsive Tiers (Desktop -> Medium Drawer -> Mobile -> Short) ── */
@media (max-width:1119px){
  .studio,.studio.rail-collapsed{grid-template-columns:1fr}
  .rail,.studio.rail-collapsed .rail{
    position:fixed;inset-block:0;inset-inline-start:0;z-index:150;
    width:min(316px,86vw);border-inline-end:1px solid var(--border-hi);
    box-shadow:var(--shadow-md);
    opacity:1;pointer-events:auto;
    transform:translateX(105%);transition:transform .2s var(--ease);
  }
  .rail.drawer-open,.studio.rail-collapsed .rail.drawer-open{transform:translateX(0)}
}
@media (max-width:959px){
  .doc-split{display:flex;flex-direction:column;overflow:auto;overscroll-behavior:contain}
  .doc-prose-wrap{overflow:visible;flex-shrink:0;min-height:auto;border-inline-end:0;border-bottom:1px solid var(--border);padding:18px 18px}
  .doc-prose{max-width:none}
  .lab-col{overflow:visible;flex-shrink:0;min-height:auto;padding:16px 18px}
  .patch-lab{grid-template-columns:1fr}
  .patch-pane{border-inline-end:0;border-bottom:1px solid var(--border)}
}
@media (max-width:767px){
  .topbar{padding:0 10px;gap:8px}
  .brand-sub,.prog-lbl,.prog-bar,.top-div,.util-lbl{display:none}
  .ws-head-top{padding:10px 14px 8px;gap:8px}
  .ws-en{display:none}
  .ws-tabs-row{padding:0 14px}
  .ws-meta{display:none}
  .doc-prose-wrap{padding:14px}
  .lab-col{padding:12px 14px}
  .game-shell{padding:12px 14px}
  .playfield{padding:12px}
  .ws-dock{padding:8px 12px calc(8px + env(safe-area-inset-bottom));gap:8px}
  .ws-dock .toast.info{display:none}
  .dock-lbl{display:none}
  .btn-primary,.btn-sec,.icon-btn,.util-btn{min-height:40px}
  .match-grid{gap:8px}
  .m-btn{padding:8px;font-size:13px}
}
@media (max-width:520px){
  .prog-meter{display:none}
}
@media (max-height:480px){
  .app{grid-template-rows:42px minmax(0,1fr)}
  .ws-head-top{padding:6px 14px 5px}
  .ws-heading h1{font-size:15px}
  .ws-en{display:none}
  .mode-btn{height:26px;padding:0 10px;font-size:12px}
  .ws-tab{height:30px;font-size:12px;padding:0 10px}
  .doc-prose-wrap{padding:12px 16px}
  .doc-prose{gap:10px}
  .doc-h2{font-size:15px;padding-bottom:6px}
  .doc-p{font-size:13.5px;line-height:1.62}
  .insight{padding:8px 11px;font-size:13px;line-height:1.55}
  .lab-col{padding:10px 14px}
  .code-line{font-size:12px;line-height:1.55;min-height:20px}
  .game-shell{padding:10px 14px}
  .mission-head{padding:9px 14px}
  .mission-head h2{font-size:14.5px}
  .playfield{padding:10px 14px;gap:10px}
  .ws-dock{min-height:44px;padding:5px 14px}
  .btn-primary,.btn-sec{height:32px;font-size:12.5px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

};

/* ─── Persistence (Existing Progress Schema Preserved 100%) ─────────────── */
const KEY = `lg2:${LESSON.id}:v1`;

/* ─── BiDi-Safe Syntax Highlighter & Line-Numbered Code Renderer ────────── */
function isolateArText(segment){
  return segment.replace(/([\u0600-\u06FF][^\n<&]*[\u0600-\u06FF.!؟،]|[ \u0600-\u06FF]*[\u0600-\u06FF]+[!؟.]?)/g, m => `<bdi class="syn-ar">${m}</bdi>`);
}
function hl(text, lang){
  const l = lang || LESSON.lang || 'html';
  let s = esc(text);
  if(l === 'plain') return s;
  if(l === 'html'){
    const parts = s.split(/(&lt;!--[\s\S]*?--&gt;|&lt;\/?[a-zA-Z!][a-zA-Z0-9-]*[\s\S]*?\/?&gt;)/g);
    return parts.map(p => {
      if(/^&lt;!--/.test(p)) return `<span class="syn-com">${p}</span>`;
      if(/^&lt;/.test(p)){
        return p.replace(/^(&lt;\/?[a-zA-Z!][a-zA-Z0-9-]*)([\s\S]*?)(\/?&gt;)$/, (_, o, attrs, c) => {
          const a = attrs.replace(/([a-zA-Z_:][-a-zA-Z0-9_:.]*)(\s*=\s*)(&quot;[^&]*?&quot;)/g,
            '<span class="syn-attr">$1</span>$2<span class="syn-val">$3</span>');
          return `<span class="syn-tag">${o}</span>${a}<span class="syn-tag">${c}</span>`;
        });
      }
      return isolateArText(p);
    }).join('');
  }
  if(l === 'css'){
    return s.replace(/(\/\*[\s\S]*?\*\/)|(@[a-z-]+)\b|((?:--[a-z0-9-]+|[a-z-]+)\s*:\s*[^;{}\n]+)/gi, (m, com, at, decl) => {
      if(com) return `<span class="syn-com">${isolateArText(com)}</span>`;
      if(at) return `<span class="syn-kw">${at}</span>`;
      return decl.replace(/^(--[a-z0-9-]+|[a-z-]+)(\s*:\s*)([\s\S]+)$/i, '<span class="syn-attr">$1</span>$2<span class="syn-val">$3</span>');
    });
  }
  if(l === 'js'){
    return s.replace(/(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|(&quot;[\s\S]*?&quot;|&#39;[\s\S]*?&#39;|`[^`]*?`)|\b(const|let|var|function|return|if|else|for|while|switch|case|break|default|of|in|typeof|class|new|true|false|null|undefined|async|await)\b|\b(console|document|window|Math|Array|Object)\b/g, (m, com, str, kw, fn) => {
      if(com) return `<span class="syn-com">${isolateArText(com)}</span>`;
      if(str) return `<span class="syn-val">${isolateArText(str)}</span>`;
      if(kw) return `<span class="syn-kw">${kw}</span>`;
      if(fn) return `<span class="syn-fn">${fn}</span>`;
      return m;
    });
  }
  if(l === 'sql'){
    return s.replace(/\b(SELECT|FROM|WHERE|JOIN|ON|GROUP BY|ORDER BY|HAVING|INSERT|INTO|VALUES|UPDATE|SET|DELETE|CREATE|TABLE|AS|AND|OR|NOT|NULL)\b/gi, '<span class="syn-kw">$1</span>');
  }
  return s;
}
function renderMarkedLine(line, lang, fn){
  return String(line).split(/(\[\[(?:ok|\d+)(?:\|[^\]]+)?\]\])/g).map(p => {
    const m = p.match(/^\[\[(ok|\d+)(?:\|([^\]]+))?\]\]$/);
    return m ? fn(m[1], m[2] || '') : hl(p, lang);
  }).join('');
}
function renderCodeLines(code, lang, markerFn){
  const lines = String(code).split('\n');
  return `<div class="code-box scroll"><div class="code-lines-inner">${lines.map((ln, idx) => {
    const content = markerFn ? renderMarkedLine(ln, lang, markerFn) : hl(ln, lang);
    return `<div class="code-line"><span class="ln" aria-hidden="true">${idx+1}</span><span class="lc">${content || ' '}</span></div>`;
  }).join('')}</div></div>`;
}

function shuffled(arr, seed){
  const out = arr.map((v,i)=>({v,i}));
  let h = 2166136261;
  for(const c of String(seed)) h = Math.imul(h ^ c.charCodeAt(0), 16777619);
  for(let i=out.length-1;i>0;i--){
    h = Math.imul(h ^ (h>>>13), 1274126177);
    const j = Math.abs(h) % (i+1);
    [out[i],out[j]] = [out[j],out[i]];
  }
  if(out.length > 1 && out.every((x,i)=>x.i===i)) [out[0],out[1]] = [out[1],out[0]];
  return out;
}

/* ─── Pointer-Events Drag Helper ────────────────────────────────────────── */
function attachDrag(el, { onTap, onDrop }){
  let sx=0, sy=0, dragging=false, ghost=null, lastDrop=null, pid=null;
  el.addEventListener('pointerdown', e => {
    if(e.button && e.button !== 0) return;
    if(e.target.closest('.mv-btn')) return;
    if(el.classList.contains('used') || el.classList.contains('locked')) return;
    pid = e.pointerId; sx = e.clientX; sy = e.clientY; dragging = false;
  });
  el.addEventListener('pointermove', e => {
    if(pid !== e.pointerId) return;
    if(!dragging && Math.hypot(e.clientX-sx, e.clientY-sy) > 7){
      dragging = true;
      try{ el.setPointerCapture(pid); }catch{}
      ghost = el.cloneNode(true); ghost.classList.add('drag-ghost');
      ghost.style.width = el.offsetWidth + 'px';
      document.body.appendChild(ghost);
    }
    if(dragging && ghost){
      ghost.style.left = e.clientX + 'px'; ghost.style.top = e.clientY + 'px';
      const u = document.elementFromPoint(e.clientX, e.clientY);
      const dz = u && u.closest('[data-drop]');
      if(lastDrop && lastDrop !== dz) lastDrop.classList.remove('drop-over');
      if(dz) dz.classList.add('drop-over');
      lastDrop = dz;
    }
  });
  const end = e => {
    if(pid !== e.pointerId) return;
    pid = null;
    if(ghost){ ghost.remove(); ghost = null; }
    if(lastDrop) lastDrop.classList.remove('drop-over');
    if(dragging){ const dz = lastDrop; lastDrop = null; if(dz && onDrop) onDrop(dz); }
    else if(onTap) onTap();
    dragging = false;
  };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
}

function selectSection(li, forceMode){
  view = 'section';
  curL = li;
  const L = LESSON.levels[curL];
  curDoc = 0;
  curS = 0;
  hearts = 3; levelMisses = 0; levelXP = 0; levelMistakes = [];
  if(forceMode) mode = forceMode;
  else mode = (L.docs && L.docs.length && !L.boss) ? 'explain' : 'play';
  renderAll();
  const activeTab = $rail.querySelector('.sec-tab.active');
  if(activeTab) activeTab.scrollIntoView({ block:'nearest' });
}

function renderAll(){
  renderChrome();
  if(view === 'recall') return renderRecallView();
  if(view === 'summary') return renderSummaryView();
  renderSectionWorkspace();
}

function renderHeartsHtml(h){
  return [1,2,3].map(n => `<svg class="${n<=h?'':'lost'}" aria-hidden="true"><use href="#i-heart"/></svg>`).join('');
}

function renderSectionWorkspace(){
  const L = LESSON.levels[curL];

  if(mode === 'explain') renderExplainMode(L);
