  drawerOpen = false;
  syncRailState();
  if(restoreFocus) document.getElementById('railToggle')?.focus();
}
$backdrop.addEventListener('click', () => closeDrawer(true));
window.addEventListener('resize', () => { if(!isDrawerMode() && drawerOpen) drawerOpen = false; syncRailState(); });

function toast(msg, kind='info'){
  const t = document.getElementById('toast');
  if(t){ t.className = `toast ${kind}`; t.textContent = msg; }
}

function openModal(title, bodyHtml, footHtml){
  lastFocus = document.activeElement;
  $modal.innerHTML = `<h3 id="modalTitle"><span>${title}</span><button class="icon-btn" id="mClose" aria-label="إغلاق">${ico('close','ic-sm')}</button></h3><div class="modal-body scroll">${bodyHtml}</div><div class="modal-foot">${footHtml||''}</div>`;
  $overlay.hidden = false;
  $modal.querySelector('#mClose').onclick = closeModal;
  $modal.querySelector('#mClose').focus();
}
function closeModal(){
  if($overlay.hidden) return;
  $overlay.hidden = true; $modal.innerHTML = '';
  if(lastFocus && lastFocus.isConnected) lastFocus.focus();
}
$overlay.addEventListener('click', e => { if(e.target === $overlay) closeModal(); });

/* ─── Pointer-Events Drag Helper ────────────────────────────────────────── */
function attachDrag(el, { onTap, onDrop }){
  let sx=0, sy=0, dragging=false, ghost=null, lastDrop=null, pid=null;
  el.addEventListener('pointerdown', e => {
    if(e.button && e.button !== 0) return;
    if(e.target.closest('.mv-btn')) return;
    if(el.classList.contains('used') || el.classList.contains('locked')) return;
    pid = e.pointerId; sx = e.clientX; sy = e.clientY; dragging = false;
  });
  el.addEventListener('pointermove', e => {
    if(pid !== e.pointerId) return;
    if(!dragging && Math.hypot(e.clientX-sx, e.clientY-sy) > 7){
      dragging = true;
      try{ el.setPointerCapture(pid); }catch{}
      ghost = el.cloneNode(true); ghost.classList.add('drag-ghost');
      ghost.style.width = el.offsetWidth + 'px';
      document.body.appendChild(ghost);
    }
    if(dragging && ghost){
      ghost.style.left = e.clientX + 'px'; ghost.style.top = e.clientY + 'px';
      const u = document.elementFromPoint(e.clientX, e.clientY);
      const dz = u && u.closest('[data-drop]');
      if(lastDrop && lastDrop !== dz) lastDrop.classList.remove('drop-over');
      if(dz) dz.classList.add('drop-over');
      lastDrop = dz;
    }
  });
  const end = e => {
    if(pid !== e.pointerId) return;
    pid = null;
    if(ghost){ ghost.remove(); ghost = null; }
    if(lastDrop) lastDrop.classList.remove('drop-over');
    if(dragging){ const dz = lastDrop; lastDrop = null; if(dz && onDrop) onDrop(dz); }
    else if(onTap) onTap();
    dragging = false;
  };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
}

/* ─── Render Global Header & Collapsible Chapter Sidebar ────────────────── */
function renderChrome(){
  const doneS = solvedCountAll();
  const pct = totalStagesAll ? Math.round((doneS / totalStagesAll) * 100) : 0;
  const comboHtml = S.streak >= 3 ? `<span class="combo-chip" title="سلسلة إجابات صحيحة">×2</span>` : '';
  const xpCls = bumpXpNext ? 'xp-chip bump' : 'xp-chip';
  bumpXpNext = false;

  $top.innerHTML = `
    <div class="top-start">
      <button class="icon-btn" id="railToggle" aria-label="إظهار أو إخفاء فهرس الأقسام" aria-controls="rail" aria-expanded="${isDrawerMode() ? drawerOpen : !railCollapsed}">${ico('panel')}</button>
      <div class="brand">
        <span class="brand-mark">${ico(emblemId())}</span>
        <div class="brand-txt">
          <div class="brand-title">${esc(LESSON.title)}</div>
          <div class="brand-sub">${esc(LESSON.subtitle || '')}</div>
        </div>
      </div>
    </div>
    <div class="top-end">
      <div class="prog-meter" aria-label="التقدم الإجمالي ${pct}% (${doneS} من ${totalStagesAll})">
        <span class="prog-lbl">التقدّم</span>
        <div class="prog-bar"><div class="prog-fill ${pct===100?'full':''}" style="width:${pct}%"></div></div>
        <span class="prog-val">${doneS}/${totalStagesAll}</span>
      </div>
      ${comboHtml}
      <span class="${xpCls}" aria-label="${S.xp} نقطة خبرة">${ico('bolt','ic-sm')} ${S.xp} XP</span>
      <span class="top-div" aria-hidden="true"></span>
      ${LESSON.recall?.length ? `<button class="util-btn ${view==='recall'?'active':''}" id="navRecall">${ico('cards','ic-sm')} <span class="util-lbl">مراجعة (${ar(LESSON.recall.length)})</span></button>` : ''}
      <button class="util-btn ${view==='summary'?'active':''}" id="navSummary">${ico('summary','ic-sm')} <span class="util-lbl">ملخص التسليم</span></button>
    </div>`;

  document.getElementById('railToggle').onclick = toggleRail;
  const nr = document.getElementById('navRecall');
  if(nr) nr.onclick = () => { view = 'recall'; closeDrawer(); renderAll(); };
  document.getElementById('navSummary').onclick = () => { view = 'summary'; closeDrawer(); renderAll(); };

  const readLink = LESSON.readUrl ? `<a class="rail-link" href="${esc(LESSON.readUrl)}" target="_blank" rel="noopener">نسخة القراءة ${ico('ext','ic-sm')}</a>` : '<span></span>';
  $rail.innerHTML = `
    <div class="rail-head">
      <div class="rail-head-title">
        <span>فهرس المحاضرة</span>
        <span class="rail-count">${ar(LESSON.levels.length)}</span>
      </div>
      <button class="icon-btn" id="railClose" aria-label="طي الفهرس">${ico('close','ic-sm')}</button>
    </div>
    <nav class="rail-list scroll" role="tablist" aria-label="التنقل بين أقسام المحاضرة">
      ${LESSON.levels.map((L,i) => {
        const sc = sectionSolvedCount(L);
        const tot = L.stages.length;
        const isDone = sc === tot && tot > 0;
        const isAct = view === 'section' && i === curL;
        const numInner = isDone ? ico('check','ic-sm') : (L.boss ? ico('boss','ic-sm') : pad2(L.num));
        return `<button class="sec-tab ${isAct?'active':''} ${isDone?'done':''} ${L.boss?'boss':''}" data-li="${i}" role="tab" aria-selected="${isAct}">
          <span class="sec-num">${numInner}</span>
          <span class="sec-info">
            <span class="sec-title">${esc(L.title)}</span>
          </span>
          <span class="sec-stat">${sc}/${tot}</span>
        </button>`;
      }).join('')}
    </nav>
    <div class="rail-foot">
      <span class="rail-foot-note">كل الأقسام متاحة مباشرة</span>
      ${readLink}
    </div>`;

  document.getElementById('railClose').onclick = toggleRail;
  $rail.querySelectorAll('.sec-tab').forEach(btn => {
    btn.onclick = () => { selectSection(+btn.dataset.li); closeDrawer(); };
  });
  syncRailState();
}

function selectSection(li, forceMode){
  view = 'section';
  curL = li;
  const L = LESSON.levels[curL];
  curDoc = 0;
  curS = 0;
  hearts = 3; levelMisses = 0; levelXP = 0; levelMistakes = [];
  if(forceMode) mode = forceMode;
  else mode = (L.docs && L.docs.length && !L.boss) ? 'explain' : 'play';
  renderAll();
  const activeTab = $rail.querySelector('.sec-tab.active');
  if(activeTab) activeTab.scrollIntoView({ block:'nearest' });
}

function renderAll(){
  renderChrome();
  if(view === 'recall') return renderRecallView();
  if(view === 'summary') return renderSummaryView();
  renderSectionWorkspace();
}

function renderHeartsHtml(h){
  return [1,2,3].map(n => `<svg class="${n<=h?'':'lost'}" aria-hidden="true"><use href="#i-heart"/></svg>`).join('');
}

/* ─── Active Section Workspace (Consolidated Header + Tabs) ─────────────── */
function renderSectionWorkspace(){
  const L = LESSON.levels[curL];
  const hasDocs = !!(L.docs && L.docs.length);
  if(!hasDocs && mode === 'explain') mode = 'play';
  const sc = sectionSolvedCount(L);

  $ws.innerHTML = `
    <div class="ws-head">
      <div class="ws-head-top">
        <div class="ws-heading">
          <span class="ws-sec-id ${L.boss?'boss':''}">${L.boss ? 'التحدي النهائي' : `قسم ${pad2(L.num)}`}</span>
          <h1>${esc(L.title)}</h1>
          ${L.en ? `<span class="ws-en">${esc(L.en)}</span>` : ''}
        </div>
        ${hasDocs ? `
          <div class="mode-switch" role="tablist" aria-label="وضع التعلم">
            <button class="mode-btn ${mode==='explain'?'active':''}" id="mExplain" role="tab" aria-selected="${mode==='explain'}">${ico('book','ic-sm')} افهم الشرح</button>
            <button class="mode-btn ${mode==='play'?'active':''}" id="mPlay" role="tab" aria-selected="${mode==='play'}">${ico('play','ic-sm')} العب وطبّق (${ar(sc)}/${ar(L.stages.length)})</button>
          </div>` : `<div class="hearts-bar">${renderHeartsHtml(hearts)} <span>${sc}/${L.stages.length}</span></div>`}
      </div>
      <div class="ws-tabs-row" id="subBar"></div>
    </div>
    <div class="ws-body" id="wsBody"></div>
    <footer class="ws-dock" id="wsDock"></footer>`;

  const me = document.getElementById('mExplain');
  const mp = document.getElementById('mPlay');
  if(me) me.onclick = () => { mode = 'explain'; renderSectionWorkspace(); };
  if(mp) mp.onclick = () => { mode = 'play'; renderSectionWorkspace(); };

  if(mode === 'explain') renderExplainMode(L);
  else renderPlayMode(L);
}

/* ─── EXPLAIN MODE: Unboxed Editorial Content + Unified Coding Lab ──────── */
function renderExplainMode(L){
  checkHandler = revealHandler = null;
  const docs = L.docs;
  const d = docs[curDoc] || docs[0];
  const $sub = document.getElementById('subBar');
  const $body = document.getElementById('wsBody');
  const $dock = document.getElementById('wsDock');

  $sub.innerHTML = `
    <div class="ws-tabs scroll-x" role="tablist" aria-label="موضوعات القسم">
      ${docs.map((item, idx) => `
        <button class="ws-tab ${idx===curDoc?'active':''}" data-di="${idx}" role="tab" aria-selected="${idx===curDoc}">
          <span>${ar(idx+1)}. ${esc(item.tab)}</span>
        </button>`).join('')}
    </div>
    <span class="ws-meta">موضوع ${ar(curDoc+1)} من ${ar(docs.length)}</span>`;

  $sub.querySelectorAll('[data-di]').forEach(b => b.onclick = () => { curDoc = +b.dataset.di; renderExplainMode(L); });

  const calloutIconId = { analogy:'spark', tip:'tip', warn:'warn' };
  const showH2 = d.heading && d.heading.trim() !== L.title.trim();
  const renderCard = c => {
    const isCodeTitle = looksCode(c.title);
    return `<div class="ref-card"><div class="ref-card-h"><span class="${isCodeTitle?'code-lbl':''}">${esc(c.title)}</span>${c.code?`<code>${esc(c.code)}</code>`:''}</div><div class="ref-card-d">${c.desc}</div></div>`;
  };

  const rightHtml = `
    <div class="doc-prose">
      ${showH2 ? `<h2 class="doc-h2">${esc(d.heading)}</h2>` : ''}
      ${(d.body || []).map(p => `<p class="doc-p">${p}</p>`).join('')}
      ${d.callout ? `<div class="insight ${esc(d.callout.kind||'analogy')}"><span class="insight-ico">${ico(calloutIconId[d.callout.kind]||'spark')}</span><div><strong>${esc(d.callout.title)}:</strong> ${d.callout.text}</div></div>` : ''}
      ${d.tip ? `<div class="insight tip"><span class="insight-ico">${ico('tip')}</span><div><strong>نصيحة:</strong> ${d.tip}</div></div>` : ''}
      ${d.warning ? `<div class="insight warn"><span class="insight-ico">${ico('warn')}</span><div><strong>خد بالك:</strong> ${d.warning}</div></div>` : ''}
      ${(d.cards && d.cards.length && (d.code || d.preview || d.console)) ? `<div class="ref-grid">${d.cards.map(renderCard).join('')}</div>` : ''}
    </div>`;

  const labBlocks = [];
  const hasLabUnit = !!(d.code || d.preview || (d.console && d.console.length));
  if(hasLabUnit){
    const hasSpots = !!(d.code && d.spots && d.spots.length);
    const codeLang = d.lang || LESSON.lang || 'html';
    const editorHtml = d.code ? `
      <div class="lab-bar">
        <span class="lab-tab">${ico('file','ic-sm')} ${esc(d.filename || 'index.html')}</span>
        <div class="lab-bar-meta">
          ${hasSpots ? `<span id="docSpotProg" dir="rtl">اضغط الأجزاء المظللة لشرحها</span>` : ''}
          <span class="lang-pill">${esc(codeLang)}</span>
        </div>
      </div>
      ${renderCodeLines(d.code, codeLang, hasSpots ? (id, txt) => `<button type="button" class="spot" data-si="${id}">${esc(txt)}</button>` : null)}
      ${hasSpots ? `<div class="lab-inspector" id="docSpotBox">${ico('xray','ic-sm')}<span>اضغط على أي جزء مظلّل جوا الكود فوق عشان تشوف شرحه بالتفصيل هنا.</span></div>` : ''}
    ` : '';

    const consoleHtml = (d.console && d.console.length) ? `
      <div class="console-pane">
        <div class="console-head"><span>Console Output</span><span>F12</span></div>
        <div class="console-body">${d.console.map(l => `<div class="console-line"><span>${esc(l)}</span></div>`).join('')}</div>
      </div>` : '';

    const previewHtml = d.preview ? `
      <div class="lab-preview">
        <div class="preview-chrome">
          <span class="preview-nav" aria-hidden="true"><span>‹</span><span>›</span><span>↻</span></span>
          <div class="preview-url">${ico('lock','ic-sm')} <span>${esc(d.previewUrl || 'file:///index.html')}</span></div>
          <span class="live-badge"><i class="live-dot"></i> معاينة مباشرة</span>
        </div>
        <div class="browser-body">${d.preview}</div>
      </div>` : '';

    labBlocks.push(`<section class="coding-lab" aria-label="بيئة الكود والمعاينة">${editorHtml}${consoleHtml}${previewHtml}</section>`);
  }
  if(d.table){
    labBlocks.push(`
      <div class="doc-table-wrap">
        <table class="doc-table">
          <thead><tr>${d.table.headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead>
          <tbody>${d.table.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody>
        </table>
      </div>`);
  }
  if(d.cards && d.cards.length && !hasLabUnit){
    labBlocks.push(`<div class="ref-grid">${d.cards.map(renderCard).join('')}</div>`);
  }

  const isSingle = labBlocks.length === 0;
  $body.innerHTML = `
    <div class="doc-split ${isSingle?'single':''}">
      <div class="doc-prose-wrap scroll">${rightHtml}</div>
      ${isSingle ? '' : `<div class="lab-col scroll">${labBlocks.join('')}</div>`}
    </div>`;

  const seenDoc = new Set();
  $body.querySelectorAll('.spot').forEach(btn => {
    btn.onclick = () => {
      const idx = +btn.dataset.si, sp = d.spots[idx];
      seenDoc.add(idx);
      $body.querySelectorAll('.spot.active').forEach(x=>x.classList.remove('active'));
      btn.classList.add('seen','active');
      const box = document.getElementById('docSpotBox');
      if(box && sp){
        box.classList.add('has-active');
        box.innerHTML = `${ico('spark','ic-sm')}<div><span class="insp-tok">${esc(sp.title)}</span> ${esc(sp.say)}</div>`;
      }
      const prog = document.getElementById('docSpotProg');
      if(prog) prog.textContent = `${ar(seenDoc.size)}/${ar(d.spots.length)} مفحوص`;
    };
  });

  const hasNextDoc = curDoc < docs.length - 1;
  $dock.innerHTML = `
    <div class="dock-g">
      <button class="btn-sec" id="prevDoc" ${curDoc===0?'disabled':''}>السابق</button>
      ${hasNextDoc ? `<button class="btn-sec" id="nextDoc">الموضوع الجاي</button>` : ''}
    </div>
    <div class="toast info" id="toast" aria-live="polite">افهم الفكرة من الشرح وجرّب تضغط على الكود، وبعدين انتقل للتطبيق العملي.</div>
    <button class="btn-primary" id="jumpPlay">${ico('play','ic-sm')} العب<span class="dock-lbl"> وطبّق (${ar(L.stages.length)} تحديات)</span></button>`;

  document.getElementById('prevDoc').onclick = () => { curDoc--; renderExplainMode(L); };
  const nd = document.getElementById('nextDoc');
  if(nd) nd.onclick = () => { curDoc++; renderExplainMode(L); };
  document.getElementById('jumpPlay').onclick = () => { mode = 'play'; renderSectionWorkspace(); };
}

/* ─── PLAY MODE: Tactile Game Workspace ─────────────────────────────────── */
function renderPlayMode(L, freeHints=false){
  stageSolved = false; stageMisses = 0; stageHintUsed = freeHints;
  checkHandler = revealHandler = null;
  const st = L.stages[curS] || L.stages[0];
  const $sub = document.getElementById('subBar');
  const $body = document.getElementById('wsBody');
  const $dock = document.getElementById('wsDock');

  $sub.innerHTML = `
    <div class="ws-tabs scroll-x" role="tablist" aria-label="تحديات القسم">
      ${L.stages.map((item, idx) => `
        <button class="ws-tab ${idx===curS?'active':''} ${S.solved[item.id]?'solved':''}" data-si="${idx}" role="tab" aria-selected="${idx===curS}">
          ${S.solved[item.id] ? ico('check','ic-sm') : ''}<span>تحدي ${ar(idx+1)}</span>
        </button>`).join('')}
    </div>
    ${L.boss ? `<div class="hearts-bar">${renderHeartsHtml(hearts)}</div>` : `<span class="ws-meta">${ar(sectionSolvedCount(L))}/${ar(L.stages.length)} مكتمل</span>`}`;

  $sub.querySelectorAll('[data-si]').forEach(b => b.onclick = () => { curS = +b.dataset.si; renderPlayMode(L); });

  $body.innerHTML = `
    <div class="game-shell scroll" id="gameShell">
      <div class="game-inner">
        <div class="mission-head">
          <h2 id="stageTitle" tabindex="-1">${esc(st.prompt)}</h2>
          <span class="type-pill">${TYPE_LABEL[st.type] || st.type}</span>
        </div>
        ${st.coach ? `<div class="insight analogy"><span class="insight-ico">${ico('spark')}</span><div><strong>كابتن كود:</strong> ${esc(st.coach)}</div></div>` : ''}
        <div class="playfield" id="playfield"></div>
      </div>
    </div>`;

  const hasDocs = !!(L.docs && L.docs.length);
  $dock.innerHTML = `
    <div class="dock-g">
      ${hasDocs ? `<button class="btn-sec" id="backExplain">${ico('book','ic-sm')} <span class="dock-lbl">راجع الشرح</span></button>` : ''}
      <button class="btn-sec" id="hintBtn" ${st.hint?'':'disabled'}>${ico('spark','ic-sm')} <span class="dock-lbl">تلميحة</span></button>
    </div>
    <div class="toast info" id="toast" aria-live="polite">${L.boss && curS===0 ? 'جه وقت الاختبار الشامل — معاك ٣ قلوب، ركّز وانطلق!' : ''}</div>
    <button class="btn-primary" id="primaryBtn">${ico('check','ic-sm')} اتأكد</button>`;

  const be = document.getElementById('backExplain');
  if(be) be.onclick = () => { mode = 'explain'; renderSectionWorkspace(); };
  const hb = document.getElementById('hintBtn');
  if(hb && st.hint){
    hb.onclick = () => {
      stageHintUsed = true; hb.classList.remove('pulse');
      toast(`${say('hint')}${st.hint}`, 'warn');
    };
  }
  if(freeHints && st.hint) toast(`${say('hint')}${st.hint}`, 'warn');

  const pf = document.getElementById('playfield');
  const pb = document.getElementById('primaryBtn');
  if(MECHANICS[st.type]) MECHANICS[st.type](st, pf, pb);
  if(!QA_MODE) document.getElementById('stageTitle')?.focus({ preventScroll:true });
}

/* ─── Scoring, Miss Handling & Section Completion ───────────────────────── */
function onMiss(whyMsg, st){
  stageMisses++; levelMisses++;
  S.streak = 0; Store.save(S);
  const L = LESSON.levels[curL];
  if(L.boss){
    hearts = Math.max(0, hearts - 1);
    renderChrome();
    $ws.querySelectorAll('.hearts-bar').forEach(x => x.innerHTML = renderHeartsHtml(hearts));
    if(hearts === 0){
      openModal('خلصت القلوب', `<p>عاش إنك وصلت لحد هنا — هنرجع نبدأ التحدي والتلميحات مفتوحة ليك مجاناً.</p>`,
        `<button class="btn-primary" id="bossRetry">جرّب تاني</button>`);
      document.getElementById('bossRetry').onclick = () => { closeModal(); hearts=3; curS=0; renderPlayMode(L, true); };
      return;
    }
  }
  if(whyMsg && !levelMistakes.includes(whyMsg)) levelMistakes.push(whyMsg);
  if(stageMisses >= 3 && revealHandler){
    toast(`${say('reveal')} ${whyMsg || ''}`, 'warn');
    revealHandler();
    markSolved({ xpOverride:0, revealed:true });
    return;
  }
  toast(`${say('wrong')}${whyMsg || ''}`, 'bad');
  const hbBtn = document.getElementById('hintBtn');
  if(hbBtn && st.hint){
    hbBtn.classList.add('pulse');
    if(stageMisses === 2 && !stageHintUsed){ stageHintUsed = true; toast(`${say('hint')}${st.hint}`, 'warn'); }
  }
  renderChrome();
}

function markSolved({ xpOverride, revealed=false, msg } = {}){
  if(stageSolved) return;
  stageSolved = true;
  const L = LESSON.levels[curL];
  const st = L.stages[curS];
  const firstClear = !S.solved[st.id];
  S.solved[st.id] = true;

  let gained = xpOverride !== undefined ? xpOverride : (stageMisses===0 ? 10 : stageMisses===1 ? 6 : 3);
  if(!firstClear) gained = Math.min(gained, 2);
  if(!revealed && stageHintUsed && gained > 0) gained = Math.max(0, gained - 2);
  let comboMsg = '';
  if(!revealed && stageMisses === 0 && xpOverride === undefined){
    S.streak = (S.streak || 0) + 1;
    if(S.streak >= 3){ gained *= 2; comboMsg = ' · ' + say('combo'); }
  }
  S.xp += gained; levelXP += gained;
  if(gained > 0) bumpXpNext = true;

  if(sectionSolvedCount(L) === L.stages.length){
    const stars = levelMisses === 0 ? 3 : levelMisses <= 2 ? 2 : 1;
    const prev = S.levels[L.id]?.stars || 0;
    S.levels[L.id] = { done:true, stars:Math.max(prev, stars) };
  }
  Store.save(S);
  if(!revealed) toast(`${msg || say('ok')} (+${gained} XP)${comboMsg}`, 'ok');
  renderChrome();

  const curPill = $ws.querySelector(`.ws-tab[data-si="${curS}"]`);
  if(curPill){ curPill.classList.add('solved'); curPill.innerHTML = `${ico('check','ic-sm')}<span>تحدي ${ar(curS+1)}</span>`; }

  const pb = document.getElementById('primaryBtn');
  if(pb){
    pb.disabled = false;
    const isLast = curS >= L.stages.length - 1;
    pb.innerHTML = isLast ? `${ico('check','ic-sm')} خلصت القسم` : `التحدي اللي بعده`;
    pb.onclick = goNextChallenge;
  }
}

function goNextChallenge(){
  const L = LESSON.levels[curL];
  if(curS < L.stages.length - 1){
    curS++;
    renderPlayMode(L);
  } else {
    const hasNext = curL < LESSON.levels.length - 1;
    const nextL = hasNext ? LESSON.levels[curL + 1] : null;
    openModal(
      `${say('levelDone')}`,
      `<div class="clear-ring">${ico('check')}</div>
       <div style="text-align:center;font-family:var(--mono);color:var(--amber);font-weight:600">+${levelXP} XP · إجمالي ${S.xp} XP</div>
       ${levelMistakes.length ? `<div class="insight warn"><span class="insight-ico">${ico('warn')}</span><div><strong>افتكر دايماً:</strong> ${esc(levelMistakes[0])}</div></div>` : `<div class="insight tip"><span class="insight-ico">${ico('tip')}</span><div>ولا غلطة! أداء نضيف ١٠٠٪ في القسم ده.</div></div>`}`,
      `<button class="btn-sec" id="mStay">أراجع القسم</button>
       <button class="btn-primary" id="mNext">${hasNext ? `القسم الجاي: ${esc(nextL.title)}` : 'بطاقات المراجعة والملخص'}</button>`
    );
    document.getElementById('mStay').onclick = closeModal;
    document.getElementById('mNext').onclick = () => {
      closeModal();
      if(hasNext) selectSection(curL + 1);
      else { view = 'recall'; renderAll(); }
    };
  }
}

/* ═══════════════════════════════════════════════════════════════════════════
   THE 8 INTERACTIVE MECHANICS
   ═══════════════════════════════════════════════════════════════════════════ */
const MECHANICS = {
  explore(st, root, pb){
    const seen = new Set(); const total = st.spots.length;
    const codeLang = st.lang || LESSON.lang || 'html';
    root.innerHTML = `
      <div class="coding-lab">
        <div class="lab-bar">
          <span class="lab-tab">${ico('file','ic-sm')} explore.${esc(codeLang)}</span>
          <div class="lab-bar-meta"><span id="expCnt" dir="rtl">فحصت ${ar(0)} من ${ar(total)}</span><span class="lang-pill">${esc(codeLang)}</span></div>
        </div>
        ${renderCodeLines(st.code, codeLang, (id, txt) => `<button type="button" class="spot" data-si="${id}">${esc(txt)}</button>`)}
        <div class="lab-inspector" id="spotCard">${ico('xray','ic-sm')}<span>اضغط على كل جزء مظلّل جوا الكود فوق عشان تشوف دوره بالتفصيل.</span></div>
      </div>`;
    pb.disabled = true; pb.textContent = `استكشف (${ar(0)}/${ar(total)})`;
    root.querySelectorAll('.spot').forEach(btn => {
      btn.onclick = () => {
        const idx = +btn.dataset.si, sp = st.spots[idx];
        root.querySelectorAll('.spot.active').forEach(b=>b.classList.remove('active'));
        btn.classList.add('seen','active'); seen.add(idx);
        const card = document.getElementById('spotCard');
        card.classList.add('has-active');
        card.innerHTML = `${ico('spark','ic-sm')}<div><span class="insp-tok">${esc(sp.title)}</span> ${esc(sp.say)}</div>`;
        const ec = document.getElementById('expCnt');
        if(ec) ec.textContent = `فحصت ${ar(seen.size)} من ${ar(total)}`;
        if(seen.size >= total) markSolved({ xpOverride:5, msg:'عاش! استكشفت الكود كله!' });
        else pb.textContent = `استكشف (${ar(seen.size)}/${ar(total)})`;
      };
    });
  },

  choice(st, root, pb){
    pb.disabled = true; pb.textContent = 'اختار الإجابة';
    const codeLang = st.lang || LESSON.lang || 'html';
    root.innerHTML = `
      ${st.code ? `<div class="coding-lab"><div class="lab-bar"><span class="lab-tab">${ico('file','ic-sm')} snippet.${esc(codeLang)}</span><span class="lang-pill">${esc(codeLang)}</span></div>${renderCodeLines(st.code, codeLang)}</div>` : ''}
      <div class="opt-grid" role="radiogroup">
        ${st.options.map((o,i) => `
          <button type="button" class="opt-btn" data-oi="${i}">
            <div class="opt-row"><span class="opt-k">${ar(i+1)}</span><span ${looksCode(o.t||'')?'class="ltr" style="font-family:var(--mono);font-size:13px"':''}>${esc(o.t || `النتيجة ${ar(i+1)}`)}</span></div>
            ${o.preview ? `<div class="opt-prev-box"><div class="browser-body">${o.preview}</div></div>` : ''}
          </button>`).join('')}
      </div>`;
    revealHandler = () => root.querySelectorAll('.opt-btn').forEach((b,i)=>{ b.disabled=true; if(i===st.answer) b.classList.add('ok'); });
    root.querySelectorAll('.opt-btn').forEach(btn => {
      btn.onclick = () => {
        if(stageSolved) return;
        const idx = +btn.dataset.oi, opt = st.options[idx];
        if(idx === st.answer){
          btn.classList.add('ok'); root.querySelectorAll('.opt-btn').forEach(b=>b.disabled=true);
          markSolved({ msg: opt.why || say('ok') });
        } else {
          btn.classList.add('bad'); btn.disabled = true;
          onMiss(opt.why || st.options[st.answer].why, st);
        }
      };
    });
  },

  slot(st, root, pb){
    const filled = Array(st.answer.length).fill(null);
    let picked = null;
    const toks = shuffled(st.tokens, st.id);
    const codeLang = st.lang || LESSON.lang || 'html';
    root.innerHTML = `
      <div class="coding-lab">
        <div class="lab-bar"><span class="lab-tab">${ico('file','ic-sm')} build.${esc(codeLang)}</span><span class="lab-bar-meta" dir="rtl">اسحب القطع أو اضغط للتركيب</span></div>
        ${renderCodeLines(st.code, codeLang, id => `<button type="button" class="slot-blank" data-drop="slot" data-si="${id}">___</button>`)}
      </div>
      <div class="tray" id="tokTray">${toks.map((t,ti)=>`<button type="button" class="chip code-chip" data-ti="${ti}">${esc(t.v)}</button>`).join('')}</div>`;
    const slotEls = [...root.querySelectorAll('.slot-blank')];
    const chipEls = [...root.querySelectorAll('.chip')];
    function sync(){
      slotEls.forEach((s,i)=>{ const ti=filled[i]; s.textContent = ti===null?'___':toks[ti].v; s.classList.toggle('filled',ti!==null); s.classList.remove('ok','bad'); });
      chipEls.forEach((c,ti)=>{ c.classList.toggle('used', filled.includes(ti)); c.classList.toggle('picked', picked===ti); });
      pb.disabled = filled.some(x=>x===null);
    }
    function place(ti, si){
      if(stageSolved) return;
      const old = filled.indexOf(ti); if(old!==-1) filled[old]=null;
      filled[si] = ti; picked = null; sync();
    }
    chipEls.forEach((c,ti)=>attachDrag(c, { onTap(){ picked=(picked===ti?null:ti); sync(); }, onDrop(dz){ if(dz.dataset.drop==='slot') place(ti, +dz.dataset.si); } }));
    slotEls.forEach((s,si)=> s.onclick = () => { if(stageSolved) return; if(picked!==null) place(picked, si); else if(filled[si]!==null){ filled[si]=null; sync(); } });
    revealHandler = () => { slotEls.forEach((s,i)=>{ s.textContent=st.answer[i]; s.classList.add('filled','ok'); }); chipEls.forEach(c=>c.classList.add('used')); };
    checkHandler = () => {
      if(stageSolved || filled.some(x=>x===null)) return;
      let ok = true;
      slotEls.forEach((s,i)=>{ const r = toks[filled[i]].v === st.answer[i]; s.classList.toggle('ok',r); s.classList.toggle('bad',!r); if(!r) ok=false; });
      if(ok) markSolved({ msg: st.why || say('ok') }); else onMiss(st.why || 'في خانة لسه مش مظبوطة — راجع الحمرا!', st);
    };
    pb.onclick = checkHandler; sync();
  },

  buckets(st, root, pb){
    pb.disabled = true; pb.textContent = 'اسحب أو اضغط كل عنصر لمكانه';
    const items = shuffled(st.items, st.id);
    const placed = new Set(); let picked = null;
    const isWire = st.layout === 'wireframe';
    const isTable = isWire && st.buckets.every(b=>['caption','thead','tbody','tfoot'].includes(b.area));
    const cls = isWire ? (isTable ? 'wireframe-table' : 'wireframe-page') : 'buckets-grid';
    root.innerHTML = `
      <div class="${cls}">${st.buckets.map(b=>`<div class="bucket" data-drop="bucket" data-bid="${esc(b.id)}" ${b.area&&!isTable?`style="grid-area:${esc(b.area)}"`:''}><div class="bucket-h">${esc(b.label)}</div><div class="bucket-items" data-bi="${esc(b.id)}"></div></div>`).join('')}</div>
      <div class="tray" id="bTray">${items.map((it,idx)=>`<button type="button" class="chip ${looksCode(it.v.t)?'code-chip':''}" data-ii="${idx}">${esc(it.v.t)}</button>`).join('')}</div>`;
    const chips = [...root.querySelectorAll('#bTray .chip')];
    const bkts = [...root.querySelectorAll('.bucket')];
    function tryDrop(idx, bid){
      if(stageSolved || placed.has(idx)) return;
      const item = items[idx].v, chip = chips[idx];
      picked = null; chips.forEach(c=>c.classList.remove('picked')); bkts.forEach(b=>b.classList.remove('hint-glow'));
      if(item.b === bid){
        placed.add(idx); chip.classList.add('locked');
        root.querySelector(`[data-bi="${CSS.escape(bid)}"]`).appendChild(chip);
        toast(item.why || say('ok'), 'ok');
        if(placed.size === items.length) markSolved();
      } else {
        chip.classList.remove('bad'); void chip.offsetWidth; chip.classList.add('bad');
        onMiss(item.why || 'جرّب خانة تانية!', st);
        if(stageMisses >= 2) root.querySelector(`[data-bid="${CSS.escape(item.b)}"]`)?.classList.add('hint-glow');
      }
    }
    chips.forEach((c,idx)=>attachDrag(c, { onTap(){ if(placed.has(idx)) return; picked=(picked===idx?null:idx); chips.forEach((x,i)=>x.classList.toggle('picked',i===picked)); }, onDrop(dz){ if(dz.dataset.drop==='bucket') tryDrop(idx, dz.dataset.bid); } }));
    bkts.forEach(b=> b.onclick = () => { if(picked !== null) tryDrop(picked, b.dataset.bid); });
    revealHandler = () => items.forEach((it,idx)=>{ if(!placed.has(idx)){ placed.add(idx); chips[idx].classList.add('locked'); root.querySelector(`[data-bi="${CSS.escape(it.v.b)}"]`).appendChild(chips[idx]); } });
  },

  order(st, root, pb){
    let arr = shuffled(st.items, st.id);
    const isCode = !!st.mono || st.items.every(x => looksCode(x));
    function draw(){
      root.innerHTML = `<div class="order-list">${arr.map((it,pos)=>`
        <div class="order-row" data-drop="order" data-pos="${pos}">
          <span class="order-idx">${ar(pos+1)}</span>
          <span class="order-txt ${isCode?'mono':''}">${esc(it.v)}</span>
          <div class="mv-btns">
            <button type="button" class="mv-btn" data-up="${pos}" aria-label="أعلى" ${pos===0?'disabled':''}>▲</button>
            <button type="button" class="mv-btn" data-dn="${pos}" aria-label="أسفل" ${pos===arr.length-1?'disabled':''}>▼</button>
          </div>
        </div>`).join('')}</div>`;
      root.querySelectorAll('[data-up]').forEach(b=> b.onclick = e => { e.stopPropagation(); swap(+b.dataset.up, +b.dataset.up-1); });
      root.querySelectorAll('[data-dn]').forEach(b=> b.onclick = e => { e.stopPropagation(); swap(+b.dataset.dn, +b.dataset.dn+1); });
      root.querySelectorAll('.order-row').forEach(r=> attachDrag(r, {
        onDrop(dz){ if(dz.dataset.drop==='order'){ const f=+r.dataset.pos, t=+dz.dataset.pos; if(f!==t){ const [m]=arr.splice(f,1); arr.splice(t,0,m); draw(); } } }
      }));
    }
    function swap(a,b){ if(stageSolved) return; [arr[a],arr[b]]=[arr[b],arr[a]]; draw(); }
    revealHandler = () => { arr = st.items.map((v,i)=>({v,i})); draw(); root.querySelectorAll('.order-row').forEach(r=>r.classList.add('ok')); };
    checkHandler = () => {
      if(stageSolved) return;
      let ok = true;
      root.querySelectorAll('.order-row').forEach((r,pos)=>{ const rt = arr[pos].i===pos; r.classList.toggle('ok',rt); r.classList.toggle('bad',!rt); if(!rt) ok=false; });
      if(ok) markSolved({ msg: st.why || say('ok') }); else onMiss(st.why || 'السطور الحمرا مش في ترتيبها الصح!', st);
    };
    pb.disabled = false; pb.onclick = checkHandler; draw();
  },

  bughunt(st, root, pb){
    const found = new Set(), total = st.bugs.length;
    const codeLang = st.lang || LESSON.lang || 'html';
    pb.disabled = true; pb.textContent = `اصطدت ${ar(0)}/${ar(total)}`;
    root.innerHTML = `
      <div class="coding-lab">
        <div class="lab-bar"><span class="lab-tab">${ico('target','ic-sm')} debug.${esc(codeLang)}</span><span class="lab-bar-meta" dir="rtl">اضغط على الغلطة جوا الكود</span></div>
        ${renderCodeLines(st.code, codeLang, (id, txt) => `<button type="button" class="bug-tok" data-bk="${id}">${hl(txt, codeLang)}</button>`)}
        <div class="lab-inspector" id="bugCard" hidden></div>
      </div>`;
    revealHandler = () => {
      root.querySelectorAll('.bug-tok').forEach(b=>{ if(b.dataset.bk!=='ok') b.classList.add('found'); });
      const bc = document.getElementById('bugCard'); bc.hidden=false; bc.classList.add('has-active');
      bc.innerHTML=`${ico('target','ic-sm')}<div><strong>الغلطة:</strong> ${esc(st.bugs.map(x=>x.why).join(' · '))}</div>`;
    };
    root.querySelectorAll('.bug-tok').forEach(btn => {
      btn.onclick = () => {
        if(stageSolved) return;
        const k = btn.dataset.bk;
        if(k === 'ok'){ btn.classList.remove('safe-hit'); void btn.offsetWidth; btn.classList.add('safe-hit'); onMiss(say('okSpot'), st); }
        else {
          const bi = +k; if(found.has(bi)) return;
          found.add(bi); btn.classList.add('found');
          const bc = document.getElementById('bugCard'); bc.hidden=false; bc.classList.add('has-active');
          bc.innerHTML=`${ico('check','ic-sm')}<div><strong>صِدتَها!</strong> ${esc(st.bugs[bi].why)}</div>`;
          if(found.size >= total) markSolved({ msg: st.bugs[bi].why });
          else { pb.textContent = `اصطدت ${ar(found.size)}/${ar(total)}`; toast(st.bugs[bi].why, 'ok'); }
        }
      };
    });
  },

  match(st, root, pb){
    pb.disabled = true; pb.textContent = `وصّل ${ar(st.pairs.length)} أزواج`;
    const lefts = st.pairs.map((p,i)=>({v:p[0],i}));
    const rights = shuffled(st.pairs.map(p=>p[1]), st.id);
    const done = new Set(); let pL = null, pR = null;
    root.innerHTML = `<div class="match-grid">
      <div class="match-col">${lefts.map(x=>`<button type="button" class="m-btn ${looksCode(x.v)?'mono-m':''}" data-ml="${x.i}">${esc(x.v)}</button>`).join('')}</div>
      <div class="match-col">${rights.map(x=>`<button type="button" class="m-btn ${looksCode(x.v)?'mono-m':''}" data-mr="${x.i}">${esc(x.v)}</button>`).join('')}</div>
    </div>`;
    const lBtns = [...root.querySelectorAll('[data-ml]')], rBtns = [...root.querySelectorAll('[data-mr]')];
    function chk(){
      if(pL===null || pR===null) return;
      const lb = root.querySelector(`[data-ml="${pL}"]`), rb = root.querySelector(`[data-mr="${pR}"]`);
      if(pL === pR){
        done.add(pL); lb.classList.remove('picked','hint-glow'); rb.classList.remove('picked','hint-glow');
        lb.classList.add('ok'); rb.classList.add('ok'); lb.disabled=rb.disabled=true; pL=pR=null;
        if(done.size === st.pairs.length) markSolved();
        else toast(`${say('ok')} (${ar(done.size)}/${ar(st.pairs.length)})`, 'ok');
      } else {
        lb.classList.add('bad'); rb.classList.add('bad'); const curPL = pL;
        setTimeout(()=>{ lb.classList.remove('bad','picked'); rb.classList.remove('bad','picked'); }, 280);
        pL=pR=null; onMiss('التوصيلة دي مش مظبوطة — فكّر في معنى المصطلح وجرّب تاني!', st);
        if(stageMisses >= 2){ root.querySelector(`[data-ml="${curPL}"]`)?.classList.add('hint-glow'); root.querySelector(`[data-mr="${curPL}"]`)?.classList.add('hint-glow'); }
      }
    }
    lBtns.forEach(b=> b.onclick = () => { if(stageSolved||b.disabled) return; lBtns.forEach(x=>x.classList.remove('picked')); pL=+b.dataset.ml; b.classList.add('picked'); chk(); });
    rBtns.forEach(b=> b.onclick = () => { if(stageSolved||b.disabled) return; rBtns.forEach(x=>x.classList.remove('picked')); pR=+b.dataset.mr; b.classList.add('picked'); chk(); });
    revealHandler = () => { lBtns.forEach(b=>{ b.classList.add('ok'); b.disabled=true; }); rBtns.forEach(b=>{ b.classList.add('ok'); b.disabled=true; }); };
  },

  patch(st, root, pb){
    const chipsHtml = (st.chips||[]).map(c=>`<button type="button" class="ins-chip" data-ins="${esc(c)}">+ ${esc(c)}</button>`).join('');
    const codeLang = st.lang || LESSON.lang || 'html';
    const isCodeCheckOnly = codeLang === 'js' && !st.previewHtml;
    root.innerHTML = `<div class="patch-lab">
      <div class="patch-pane">
        <div class="patch-tools">
          <div class="chip-bar">${chipsHtml}</div>
          <button type="button" class="util-btn" id="pReset">${ico('reset','ic-sm')} رجّع الكود</button>
        </div>
        <textarea class="patch-ta" id="pTa" spellcheck="false" aria-label="محرر الكود">${esc(st.start)}</textarea>
      </div>
      ${isCodeCheckOnly ? `
        <div class="patch-out js-out">
          <div class="lab-bar"><span class="lab-tab">${ico('check','ic-sm')} فحص الكود المباشر</span><span class="lang-pill">JS</span></div>
          <div class="patch-check-list" id="pChecklist"></div>
        </div>` : `
        <div class="patch-out">
          <div class="preview-chrome">
            <div class="preview-url">${ico('eye','ic-sm')} <span>live-preview</span></div>
            <span class="live-badge"><i class="live-dot"></i> معاينة حية</span>
          </div>
          <iframe id="pFrame" sandbox="" title="معاينة حية"></iframe>
        </div>`}
    </div>`;
    const ta = document.getElementById('pTa');
    const fr = document.getElementById('pFrame');
    const cl = document.getElementById('pChecklist');
    let tm = null;
    const evalCheck = (c, val, doc) => {
      if(c.selector && !doc.querySelector(c.selector)) return false;
      if(c.notSelector && doc.querySelector(c.notSelector)) return false;
      if(c.regex && !(new RegExp(c.regex, c.flags||'i').test(val))) return false;
      if(c.notRegex && (new RegExp(c.notRegex, c.flags||'i').test(val))) return false;
      return true;
    };
    const upd = () => {
      const val = ta.value;
      if(fr){
        const bodyContent = st.previewHtml ? `<style>${val}</style>${st.previewHtml}` : val;
        fr.srcdoc = `<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><style>body{font-family:system-ui,sans-serif;padding:12px;margin:0;background:#FDFCF9;color:#182230;font-size:14px}img{max-width:100%}a{color:#0E7C90}</style></head><body>${bodyContent}</body></html>`;
      }
      if(cl){
        const doc = new DOMParser().parseFromString(val, 'text/html');
        cl.innerHTML = st.checks.map((c, idx) => {
          const ok = evalCheck(c, val.trim(), doc);
          return `<div class="pchk ${ok?'pass':''}">${ok ? ico('check','ic-sm') : ico('target','ic-sm')}<span>شرط ${ar(idx+1)}: ${esc(c.label || c.fail)}</span></div>`;
        }).join('');
      }
    };
    upd();
    ta.addEventListener('input', () => { clearTimeout(tm); tm = setTimeout(upd, 180); });
    ta.addEventListener('keydown', e => {
      if(e.key==='Tab'){ e.preventDefault(); const s=ta.selectionStart,en=ta.selectionEnd; ta.value=ta.value.slice(0,s)+'  '+ta.value.slice(en); ta.selectionStart=ta.selectionEnd=s+2; }
    });
    root.querySelectorAll('[data-ins]').forEach(btn => btn.onclick = () => {
      const ins = btn.dataset.ins, pos = ta.selectionStart ?? ta.value.length;
      const b = ta.value.slice(0,pos), a = ta.value.slice(ta.selectionEnd ?? pos);
      const pad = b.length && !/\s$/.test(b) && !b.endsWith('<') ? ' ' : '';
      ta.value = b + pad + ins + a; ta.focus(); ta.selectionStart = ta.selectionEnd = (b+pad+ins).length; upd();
    });
    document.getElementById('pReset').onclick = () => { ta.value = st.start; upd(); ta.focus(); };
    revealHandler = () => { if(st.solution){ ta.value = st.solution; upd(); } };
    checkHandler = () => {
      if(stageSolved) return;
      const val = ta.value.trim(), doc = new DOMParser().parseFromString(val, 'text/html');
      for(const c of st.checks){
        if(!evalCheck(c, val, doc)) return onMiss(c.fail, st);
      }
      markSolved({ msg: st.why || 'كودك شغال ١٠٠٪!' });
    };
    pb.disabled = false; pb.onclick = checkHandler;
  }
};

/* ─── Recall Flashcards & Submission Summary Views ──────────────────────── */
function renderRecallView(){
  checkHandler = revealHandler = null;
  if(!recallQ.length && LESSON.recall?.length){
    recallQ = LESSON.recall.map((r,i)=>({...r, id:i, retried:false}));
    recallIdx = 0; recallFlipped = false;
  }
  const finished = recallIdx >= recallQ.length;
  const card = recallQ[recallIdx];
  $ws.innerHTML = `
    <div class="ws-head"><div class="ws-head-top"><div class="ws-heading"><span class="ws-sec-id">مراجعة سريعة</span><h1>ثبّت أهم أفكار المحاضرة</h1></div></div></div>
    <div class="recall-wrap scroll">
      ${finished ? `<div class="flashcard"><div class="clear-ring">${ico('check')}</div><div class="flash-q">خلّصت كل بطاقات المراجعة!</div><div><button class="btn-sec" id="recRestart">${ico('reset','ic-sm')} راجع من الأول</button></div></div>` : `
        <div class="flashcard">
          <div style="font-family:var(--mono);font-size:12px;color:var(--muted)">بطاقة ${ar(recallIdx+1)} من ${ar(recallQ.length)}</div>
          <div class="flash-q">${esc(card.q)}</div>
          ${recallFlipped
            ? `<div class="flash-a">${esc(card.a)}</div><div style="display:flex;gap:8px;justify-content:center"><button class="btn-primary" id="recOk">${ico('check','ic-sm')} عرفتها</button><button class="btn-sec" id="recNo">${ico('reset','ic-sm')} لسه شوية</button></div>`
            : `<div><button class="btn-primary" id="recFlip">${ico('eye','ic-sm')} ورّيني الإجابة</button></div>`}
        </div>`}
    </div>
    <footer class="ws-dock">
      <button class="btn-sec" id="backSec">ارجع للأقسام</button>
      <div class="toast info">اضغط على أي قسم من الفهرس في أي وقت</div>
      <button class="btn-primary" id="goSum">${ico('summary','ic-sm')} ملخص التسليم</button>
    </footer>`;
  const fl = document.getElementById('recFlip'); if(fl) fl.onclick = () => { recallFlipped=true; renderRecallView(); };
  const ok = document.getElementById('recOk'); if(ok) ok.onclick = () => { recallIdx++; recallFlipped=false; renderRecallView(); };
  const no = document.getElementById('recNo'); if(no) no.onclick = () => { if(!card.retried) recallQ.push({...card, retried:true}); recallIdx++; recallFlipped=false; renderRecallView(); };
  const rs = document.getElementById('recRestart'); if(rs) rs.onclick = () => { recallQ=[]; renderRecallView(); };
  document.getElementById('backSec').onclick = () => { view='section'; renderAll(); };
  document.getElementById('goSum').onclick = () => { view='summary'; renderAll(); };
}

function renderSummaryView(){
  checkHandler = revealHandler = null;
  $ws.innerHTML = `
    <div class="ws-head"><div class="ws-head-top"><div class="ws-heading"><span class="ws-sec-id">ملخص التسليم</span><h1>نقط مهمة تكتبها في «تقديم الحل» تحت</h1></div></div></div>
    <div class="recall-wrap scroll" style="justify-content:flex-start">
      <div class="insight tip" style="width:min(720px,100%)"><span class="insight-ico">${ico('tip')}</span><div><strong>إزاي تقفّل المهمة في CodeHub:</strong> افتح لوحة «تقديم الحل» تحت الشاشة واكتب ملخصك بأسلوبك مغطي النقط دي:</div></div>
      <ul class="sum-list">${(LESSON.summary||[]).map((s,i)=>`<li><span class="sum-num">${ar(i+1)}</span><span>${esc(s)}</span></li>`).join('')}</ul>
    </div>
    <footer class="ws-dock">
      <button class="btn-sec" id="backSec">ارجع للأقسام</button>
      <div class="toast ok">إجمالي نقطك لحد دلوقتي: ${S.xp} XP</div>
      <button class="btn-primary" id="goRec">${ico('cards','ic-sm')} بطاقات المراجعة</button>
    </footer>`;
  document.getElementById('backSec').onclick = () => { view='section'; renderAll(); };
  document.getElementById('goRec').onclick = () => { view='recall'; renderAll(); };
}

/* ─── Input-Safe Global Keyboard Navigation ─────────────────────────────── */
window.addEventListener('keydown', e => {
  const tag = document.activeElement?.tagName;
  if(tag === 'INPUT' || tag === 'TEXTAREA') return;
  if(e.key === 'Escape'){
    if(!$overlay.hidden){ e.preventDefault(); closeModal(); return; }
    if(drawerOpen){ e.preventDefault(); closeDrawer(true); return; }
  }
  if(!$overlay.hidden || view !== 'section' || mode !== 'play') return;
  if(e.key === 'Enter'){ const pb=document.getElementById('primaryBtn'); if(pb&&!pb.disabled){ e.preventDefault(); pb.click(); } }
  else if(e.key.toLowerCase()==='h'){ const hb=document.getElementById('hintBtn'); if(hb&&!hb.disabled){ e.preventDefault(); hb.click(); } }
  else if(/^[1-4]$/.test(e.key)){ const b=$ws.querySelector(`.opt-btn[data-oi="${+e.key-1}"]`); if(b&&!b.disabled){ e.preventDefault(); b.click(); } }
});

/* ─── Built-in QA Self-Audit (?qa=1 & window.__LG_QA) ───────────────────── */
function runQA(){
  const rows = [];
  LESSON.levels.forEach((L, li) => {
    if(L.docs?.length){
      L.docs.forEach((d, di) => {
        view='section'; curL=li; mode='explain'; curDoc=di; renderAll();
        rows.push({ id:`${L.id}:doc${di}`, type:'explain', docY:Math.max(0,document.documentElement.scrollHeight-innerHeight), docX:Math.max(0,document.documentElement.scrollWidth-innerWidth) });
      });
    }
    L.stages.forEach((st, si) => {
      view='section'; curL=li; mode='play'; curS=si; renderAll();
      rows.push({ id:st.id, type:st.type, docY:Math.max(0,document.documentElement.scrollHeight-innerHeight), docX:Math.max(0,document.documentElement.scrollWidth-innerWidth) });
    });
  });
  view='recall'; renderAll();
  rows.push({ id:'RECALL', type:'recall', docY:Math.max(0,document.documentElement.scrollHeight-innerHeight), docX:Math.max(0,document.documentElement.scrollWidth-innerWidth) });
  view='summary'; renderAll();
  rows.push({ id:'SUMMARY', type:'summary', docY:Math.max(0,document.documentElement.scrollHeight-innerHeight), docX:Math.max(0,document.documentElement.scrollWidth-innerWidth) });
  selectSection(0, 'explain');
  window.__LG_QA_RESULT = { viewport:`${innerWidth}x${innerHeight}`, rows };
  return window.__LG_QA_RESULT;
}
window.__LG_QA = runQA;

/* ─── Boot ──────────────────────────────────────────────────────────────── */
selectSection(0);
if(QA_MODE) setTimeout(()=> {
  const r = runQA();
  const bad = r.rows.filter(x=>x.docY>1||x.docX>1);
  openModal(`QA (${r.viewport})`, `<p>Checked ${r.rows.length} views · Document overflows: <strong>${bad.length}</strong></p>`, `<button class="btn-primary" id="qaOk">تمام</button>`);
  document.getElementById('qaOk').onclick = closeModal;
}, 120);
})();
</script>
